<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Generator</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 50px; text-align: center; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        textarea { width: 100%; height: 100px; margin-bottom: 20px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; }
        button { background-color: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; }
        button:hover { background-color: #218838; }
        #status { margin-top: 20px; font-weight: bold; color: #555; }
        video { margin-top: 20px; width: 100%; border-radius: 10px; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Apna Video Banayein 🎬</h2>
        <textarea id="textInput" placeholder="Yahan apna text likhein... (e.g., Artificial Intelligence is the future!)"></textarea>
        <br>
        <button id="generateBtn" onclick="generateVideo()">Video Banao</button>
        
        <p id="status"></p>
        
        <video id="resultVideo" controls></video>
    </div>

    <script>
        async function generateVideo() {
            const text = document.getElementById("textInput").value;
            const statusText = document.getElementById("status");
            const videoElement = document.getElementById("resultVideo");
            const btn = document.getElementById("generateBtn");

            if (!text) {
                alert("Kripya pehle text likhein!");
                return;
            }

            // UI Update: Loading state
            statusText.innerText = "⏳ Video ban rahi hai, kripya wait karein... (Isme 15-20 seconds lag sakte hain)";
            videoElement.style.display = "none";
            btn.disabled = true;

            try {
                // Flask API ko call karna
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                const data = await response.json();

                if (data.status === "success") {
                    statusText.innerText = "✅ Video successfully ban gayi!";
                    // Video player mein URL set karna
                    videoElement.src = data.video_url;
                    videoElement.style.display = "block";
                } else {
                    statusText.innerText = "❌ Error: " + data.error;
                }
            } catch (error) {
                statusText.innerText = "❌ Server error aagaya.";
            }

            btn.disabled = false;
        }
    </script>
</body>
</html>
